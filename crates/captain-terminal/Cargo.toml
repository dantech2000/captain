[package]
name = "captain-terminal"
description = "Terminal emulation behind a swappable Emulator trait, and the PTY of Captain's terminal panel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["alacritty"]
# The emulator Captain ships today. See docs/adr/0007-terminal-emulator.md.
alacritty = ["dep:alacritty_terminal"]
# Reserved for libghostty-vt. It needs Zig in the toolchain, so it has no code yet.
ghostty = []

[dependencies]
alacritty_terminal = { workspace = true, optional = true }
portable-pty.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[lints]
workspace = true
