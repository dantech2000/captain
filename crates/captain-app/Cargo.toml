[package]
name = "captain-app"
description = "A native desktop client for Docker"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "captain"
path = "src/main.rs"

[dependencies]
captain-core.workspace = true
captain-docker.workspace = true
captain-host.workspace = true
captain-kube.workspace = true
captain-ui.workspace = true
dirs.workspace = true
futures.workspace = true
gpui-kit.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# The tray icon. Linux is left out until its GTK dependency works in CI; see ADR 0006.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
muda.workspace = true
tray-icon.workspace = true

# The Dock badge; see feature 0032.
[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-foundation.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
winreg.workspace = true

[lints]
workspace = true

# Linux and Windows packages, built by cargo-packager in .github/workflows/release.yml.
# macOS uses scripts/bundle-macos.sh and scripts/package-macos.sh instead; see
# docs/features/0021-packaging.md. Paths are relative to this folder.
[package.metadata.packager]
product-name = "Captain"
identifier = "dev.captain.Captain"
publisher = "Captain"
category = "DeveloperTool"
description = "A native desktop client for Docker"
icons = ["../../assets/icon/brand.png"]
formats = ["deb", "appimage", "wix"]
before-packaging-command = "cargo build -p captain-app --release"

[package.metadata.packager.deb]
depends = ["libxkbcommon-x11-0", "libwayland-client0", "libvulkan1", "libfontconfig1"]
section = "devel"
