[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dantech2000/captain"
rust-version = "1.98"

[workspace.dependencies]
captain-core = { path = "crates/captain-core" }
captain-docker = { path = "crates/captain-docker" }
captain-host = { path = "crates/captain-host" }
captain-kube = { path = "crates/captain-kube" }
captain-terminal = { path = "crates/captain-terminal" }
captain-ui = { path = "crates/captain-ui" }

alacritty_terminal = "0.26"
anyhow = "1"
base64 = "0.22"
bollard = "0.21"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.6", features = ["derive", "env"] }
clap_complete = "4.6"
dirs = "6"
futures = "0.3"
# Reads and edits settings.json with its comments; see docs/adr/0013-settings-file-and-docs.md.
jsonc-parser = { version = "0.34", features = ["cst", "serde", "serde_json"] }
gpui-kit = "0.7"
# The web view for extension windows; see docs/adr/0011-extensions.md.
gpui-wry = "0.7"
k8s-openapi = { version = "0.28", features = ["latest"] }
# The LSP types of the project editor's completion and hover; GPUI Kit does not
# re-export them. See docs/features/0039-compose-and-dockerfile-editor.md.
lsp-types = "0.97"
kube = { version = "4.2", default-features = false, features = ["client", "rustls-tls", "ring", "ws"] }
muda = { version = "0.20", default-features = false }
# The Dock badge, macOS only. tray-icon already pulls these versions in.
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSDockTile", "NSResponder"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString"] }
raw-window-handle = { version = "0.6", features = ["std"] }
# The MCP server of `captain mcp`, stdio only; see docs/features/0038-agent-tools.md.
rmcp = { version = "3.5", default-features = false, features = ["server", "macros", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "1.3"
# Picks the newest version tag of an extension; see docs/features/0025-extensions.md.
semver = "1"
# Kills process groups without unsafe code; see crates/captain-docker/src/process_group.rs.
# The JSON Schema for settings.json. gpui-kit already builds this version.
schemars = "1.2"
rustix = { version = "1", features = ["process"] }
# Lists an extension's tags on its registry over HTTPS, with the system's trusted
# certificates. kube already builds these versions.
rustls-platform-verifier = "0.7"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "rt-multi-thread", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "ring", "tls12"] }
tracing = "0.1"
# The Dockerfile grammar for the project editor; tree-sitter-dockerfile needs an
# older tree-sitter. See docs/features/0039-compose-and-dockerfile-editor.md.
tree-sitter-containerfile = "0.9.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tray-icon = "0.25"
winreg = "0.55"
# gpui-wry builds on Longbridge's fork of wry; pin the same version.
wry = { package = "lb-wry", version = "0.53.3" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
