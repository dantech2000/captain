[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dantech2000/captain"
rust-version = "1.98"

[workspace.dependencies]
captain-core = { path = "crates/captain-core" }
captain-docker = { path = "crates/captain-docker" }
captain-host = { path = "crates/captain-host" }
captain-terminal = { path = "crates/captain-terminal" }
captain-ui = { path = "crates/captain-ui" }

alacritty_terminal = "0.26"
anyhow = "1"
bollard = "0.21"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"
futures = "0.3"
gpui-kit = "0.7"
muda = { version = "0.20", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "rt-multi-thread", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tray-icon = "0.25"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
